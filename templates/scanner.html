
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Code Scanner</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        #reader {
            width: 100%;
        }

        #result {
            margin-top: 20px;
            padding: 12px;
            background: #f2f2f2;
            overflow-wrap: anywhere;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>QR Code Scanner</h1>

    <div id="reader"></div>

    <div id="result" role="status">
        Point your camera at a QR code.
    </div>

    <script>
        const resultElement = document.getElementById("result");

        let scanner;
        let processing = false;

        async function onScanSuccess(decodedText) {
            // Prevent duplicate requests while processing a scan.
            if (processing) return;
            processing = true;

            resultElement.textContent = "QR code detected. Processing...";

            try {
                await scanner.stop();

                const response = await fetch("/api/scan", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        content: decodedText
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Scan failed");
                }

                resultElement.textContent =
                    "Scanned successfully: " + data.content;

            } catch (error) {
                resultElement.textContent =
                    "Error: " + error.message;
            }
        }

        async function startScanner() {
            scanner = new Html5Qrcode("reader");

            try {
                await scanner.start(
                    { facingMode: "environment" },
                    {
                        fps: 10,
                        qrbox: { width: 250, height: 250 }
                    },
                    onScanSuccess,
                    () => {}
                );
            } catch (error) {
                resultElement.textContent =
                    "Could not start the camera. Check camera permissions.";
            }
        }

        startScanner();
    </script>
</body>
</html>
