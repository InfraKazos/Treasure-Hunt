
<!DOCTYPE html>
<html lang="en">

<style>
    html, body{
        margin: 0;
        width: 100%;
        height: 100%;
    }

    @keyframes flashRed {
        0%, 100% {
            color: inherit;
        }
        50% {
            color: red;
        }
    }

    @keyframes flashYellow {
        0%, 100% {
            color: inherit;
        }
        50% {
            color: yellow;
        }
    }


    .flash-red {
        animation: flashRed 0.5s ease;
    }

    .flash-yellow {
        animation: flashYellow 0.5s ease;
    }


    body {
        background: linear-gradient(
            135deg,
            #571370 0%,
            #ff8800 100%
            );
        min-height: 100vh;
        margin: 0;
    }

    #fullscreen{
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    @font-face {
        font-family: "MyCursive";
        src: url("{{ url_for('static', filename='fonts/GreatVibes-Regular.ttf') }}") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }

    #sheet {
        background-color: white;
        padding: 20px;
        transform: translateY(1000%);
        transition: transform 1s ease-in-out;
        /* font-family: MyCursive, cursive; */
        background-image: url("{{url_for('static', filename='images/paper.jpg') }}");
        padding-bottom: 30px;
    }

    #sheet h1{
        user-select: none;
        margin: 0px;
    }

    #sheet h2{
        margin: 0px;
        margin-top: 60px;
        user-select: none;
    }
    
    #sheet.show {
        transform: translateX(0) scale(2);
    }

    #submit {
        width: 100%;
        background-color: rgba(255, 255, 255, 0);
        appearance: none;
        transform: translateY(-5px) rotate(180deg) scaleX(1.05) scaleY(1.4);
        border: none;
        user-select: none;
    }
    
    #submit:hover {
        cursor: pointer;
    }

    #sheet input {
        outline: none;
        border: none;
        border-bottom: 3px solid black;
        /* font-family: MyCursive, cursive; */
        text-align: center;
        background: none;
    }

    #sheet.submit{
        transform: translateY(-1000px);
    }

</style>

<script>
    let submitCD = false;
    if(localStorage.getItem("user_id") !== null){
        window.location.href = "/game";
    }
    window.addEventListener("load", () => {
        document.getElementById("sheet").classList.add("show");
        document.getElementById("submit").addEventListener("click", () => {
            if(submitCD) return;
            submitCD = true;
            setTimeout(()=>{submitCD = false}, 750);
            console.log("submit");

            let invalid = false;

            const team_name = document.getElementById("team-name").value.trim();
            if(team_name.length === 0) {
                document.getElementById("team-name-title").classList.add("flash-red");
                setTimeout(() => {
                    document.getElementById("team-name-title").classList.remove("flash-red");
                }, 500);
                invalid = true;
            }
            const unit_floor = document.getElementById("unit-floor").value;
            const unit_number = document.getElementById("unit-number").value;
            if(unit_floor.length === 0 || unit_number.length === 0 || parseInt(unit_floor) < 0 || parseInt(unit_floor) > 16 || parseInt(unit_number) < 1 || parseInt(unit_number) > 40){
                document.getElementById("unit-number-title").classList.add("flash-red");
                setTimeout(() => {
                    document.getElementById("unit-number-title").classList.remove("flash-red");
                }, 500);
                invalid = true;
            }
            const pax = document.getElementById("pax").value;
            if(pax.length === 0){
                document.getElementById("pax-title").classList.add("flash-red");
                setTimeout(() => {
                    document.getElementById("pax-title").classList.remove("flash-red");
                }, 500);
                invalid = true;
            }
            
            if(invalid) return;

            console.log("Team Name:", team_name);
            console.log("Unit: #" + unit_floor.toString() + "-" + unit_number.toString());
            console.log("Players:", pax);

            fetch("/api/registration", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    content: {team_name: team_name, unit_floor: unit_floor, unit_number: unit_number, pax: pax}
                })
            }).then(response => {
                console.log(response.ok);
                return response.json();
            }).then(data => {
                if(data.success){
                    document.getElementById("sheet").classList.add("submit");
                    localStorage.setItem("user_id", data.content);
                    setTimeout(() => {
                        window.location.href = "/game";
                    }, 1000);
                }else{
                    console.log(data.content);
                    let errored = ["team-name-title", "unit-number-title"][data.content];
                    console.log(errored);
                    document.getElementById(errored).classList.add("flash-yellow");
                    setTimeout(() => {
                        document.getElementById(errored).classList.remove("flash-yellow");
                    }, 500);
                }
            });
        });
    });
</script>

<head>
    <meta charset="UTF-8">
    <title>Registration</title>
</head>
<body>
    <div id="fullscreen">
        <div id="sheet">
            <button id="submit">V</button>
            <h1 id="big-title">Hidden in Rivercove</h1>
            <h2 style="margin-top: 20px;" id="team-name-title">Team name</h2>
            <input type="text" maxlength="20" id="team-name" style="text-align: left;">
            <h2 id="unit-number-title">Unit number</h2>
            #<input size="1" type="text" maxlength="2" id="unit-floor">-<input id='unit-number' type="text" maxlength="2" size="1">
            <h2 id="pax-title">Number of players</h2>
            <input type="number" id="pax" min="1" max="6" step="1" onkeydown="return ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(event.key) || (/[1-6]/.test(event.key)) && event.target.value.length === 0">
        </div>
    </div>
</body>
</html>
